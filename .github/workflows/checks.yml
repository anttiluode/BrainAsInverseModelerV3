name: checks

on:
  push:
  pull_request:

jobs:
  gate-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Re-run frozen Gate A experiment
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/run_gate_a.py --output /tmp/gate_a_ci.json
      - name: Compare scientific payload with committed receipt
        run: python scripts/compare_receipts.py results/gate_a_receipt.json /tmp/gate_a_ci.json
