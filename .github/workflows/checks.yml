name: checks

on:
  push:
  pull_request:

jobs:
  scientific-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install frozen numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Re-run frozen Gate A experiment
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/run_gate_a.py --output /tmp/gate_a_ci.json
      - name: Compare Gate A scientific payload with committed receipt
        run: python scripts/compare_receipts.py results/gate_a_receipt.json /tmp/gate_a_ci.json
      - name: Re-run frozen Gate C0 experiment
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/run_gate_c0.py --output /tmp/gate_c0_ci.json
      - name: Compare Gate C0 scientific payload with committed receipt
        run: python scripts/compare_gate_c0_receipts.py results/gate_c0_receipt.json /tmp/gate_c0_ci.json
